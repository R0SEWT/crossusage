[package]
name = "crossusage-cli"
version = "1.6.1"
description = "CrossUsage CLI — terminal interface for the same plugin engine as the GUI"
edition = "2021"

[[bin]]
name = "crossusage-cli"
path = "src/main.rs"

[dependencies]
include_dir = "0.7.4"
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "cargo"] }
crossterm = "0.28"
crossusage-core = { path = "../crossusage-core" }
dirs = "6"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tabled = { version = "0.17", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
